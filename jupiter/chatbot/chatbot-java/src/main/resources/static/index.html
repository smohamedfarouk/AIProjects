<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEPEC OpenAI Chatbot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
<style>
  :root { --bg:#fff; --side:#f0f2f6; --text:#262730; --muted:#6b6f7b; --user:#e8f0fe; --bot:#f7f7f9; --accent:#ff4b4b; --border:#dde1e7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1117; --side:#262730; --text:#fafafa; --muted:#a3a8b8; --user:#1f2a44; --bot:#1a1c24; --border:#3a3d48; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; }
  aside { width:260px; background:var(--side); padding:24px 16px; flex-shrink:0; }
  aside h2 { margin-top:0; font-size:1.2rem; }
  aside button { width:100%; padding:8px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); cursor:pointer; font-size:0.95rem; }
  aside button:hover { border-color:var(--accent); color:var(--accent); }
  aside hr { border:none; border-top:1px solid var(--border); margin:20px 0; }
  main { flex:1; display:flex; flex-direction:column; max-width:760px; margin:0 auto; padding:32px 16px 0; width:100%; }
  h1 { margin:0 0 4px; }
  .caption { color:var(--muted); font-size:0.9rem; margin-bottom:24px; }
  #messages { flex:1; display:flex; flex-direction:column; gap:12px; padding-bottom:16px; }
  .msg { display:flex; gap:10px; padding:12px; border-radius:10px; white-space:pre-wrap; line-height:1.5; }
  .msg.user { background:var(--user); }
  .msg.assistant { background:var(--bot); }
  .avatar { flex-shrink:0; }
  .thinking { color:var(--muted); font-style:italic; }
  form { position:sticky; bottom:0; background:var(--bg); padding:12px 0 24px; display:flex; gap:8px; }
  input { flex:1; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:1rem; }
  form button { padding:0 18px; border:none; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; font-size:1rem; }
  form button:disabled { opacity:0.5; cursor:default; }
  @media (max-width: 700px) { body { flex-direction:column; } aside { width:100%; } }
</style>
</head>
<body>
<aside>
  <h2>Controls</h2>
  <button id="clear">Clear Conversation</button>
  <hr>
  <p><strong>About this bot</strong></p>
  <p>BEPEC Assistant</p>
</aside>
<main>
  <h1>📌 BEPEC Memory Chatbot</h1>
  <div class="caption">Powered by OpenAI + LangChain4j (few-shot)</div>
  <div id="messages"></div>
  <form id="form">
    <input id="input" placeholder="Ask me anything..." autocomplete="off" autofocus>
    <button id="send" type="submit">Send</button>
  </form>
</main>
<script>
  const messages = document.getElementById('messages');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');

  function addMessage(role, text, extraClass) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    const avatar = document.createElement('span');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '🧑' : '🤖';
    const body = document.createElement('span');
    body.textContent = text;
    if (extraClass) body.className = extraClass;
    div.append(avatar, body);
    messages.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth' });
    return body;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    send.disabled = true;
    addMessage('user', text);
    const pending = addMessage('assistant', 'Thinking...', 'thinking');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      pending.textContent = data.reply;
    } catch (err) {
      pending.textContent = 'Sorry, something went wrong: ' + err.message;
    }
    pending.className = '';
    send.disabled = false;
    input.focus();
  });

  document.getElementById('clear').addEventListener('click', async () => {
    await fetch('/api/clear', { method: 'POST' });
    messages.innerHTML = '';
    input.focus();
  });
</script>
</body>
</html>
